<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта Монополии 11x11</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Сцена с перспективой */
    .scene {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
    }

    /* Игровое поле 11x11, автоматически масштабируемое под экран */
    .board {
      width: min(80vw, 80vh);
      height: min(80vw, 80vh);
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(11, 1fr);
      gap: 2px;
      background-color: #2a2a2a;
      padding: 6px;
      border-radius: 12px;
      
      /* Изометрический наклон */
      transform: rotateX(50deg) rotateZ(-45deg);
      transform-style: preserve-3d;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    /* Стили базовой ячейки */
    .cell {
      background-color: #e0e0e0;
      border: 1px solid #b0b0b0;
      border-radius: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(6px, 1vw, 11px);
      font-weight: bold;
      color: #222;
      user-select: none;
      text-align: center;
    }

    /* Угловые клетки */
    .corner {
      background-color: #2980b9;
      color: #ffffff;
    }

    /* Специальные клетки (?) */
    .special {
      background-color: #8e44ad;
      color: #ffffff;
    }

    /* Центральная зона поля (занимает ячейки с 2 по 10 по вертикали и горизонтали) */
    .center-zone {
      grid-column: 2 / 11;
      grid-row: 2 / 11;
      background-color: #27ae60;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: clamp(10px, 2vw, 20px);
      font-weight: bold;
      border: 2px dashed rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="board">

      <!-- ================= ВЕРХНИЙ РЯД (Строка 1, Колонки 1..11) ================= -->
      <div class="cell corner" style="grid-column: 1; grid-row: 1;">Старт</div>
      <div class="cell" style="grid-column: 2; grid-row: 1;">1</div>
      <div class="cell special" style="grid-column: 3; grid-row: 1;">?</div>
      <div class="cell" style="grid-column: 4; grid-row: 1;">3</div>
      <div class="cell" style="grid-column: 5; grid-row: 1;">4</div>
      <div class="cell special" style="grid-column: 6; grid-row: 1;">?</div>
      <div class="cell" style="grid-column: 7; grid-row: 1;">6</div>
      <div class="cell" style="grid-column: 8; grid-row: 1;">7</div>
      <div class="cell special" style="grid-column: 9; grid-row: 1;">?</div>
      <div class="cell" style="grid-column: 10; grid-row: 1;">9</div>
      <div class="cell corner" style="grid-column: 11; grid-row: 1;">Тюрьма</div>

      <!-- ================= ПРАВАЯ СТОРОНА (Колонка 11, Строки 2..10) ================= -->
      <div class="cell" style="grid-column: 11; grid-row: 2;">11</div>
      <div class="cell special" style="grid-column: 11; grid-row: 3;">?</div>
      <div class="cell" style="grid-column: 11; grid-row: 4;">13</div>
      <div class="cell" style="grid-column: 11; grid-row: 5;">14</div>
      <div class="cell special" style="grid-column: 11; grid-row: 6;">?</div>
      <div class="cell" style="grid-column: 11; grid-row: 7;">16</div>
      <div class="cell" style="grid-column: 11; grid-row: 8;">17</div>
      <div class="cell special" style="grid-column: 11; grid-row: 9;">?</div>
      <div class="cell" style="grid-column: 11; grid-row: 10;">19</div>

      <!-- ================= НИЖНИЙ РЯД (Строка 11, Колонки 11..1) ================= -->
      <div class="cell corner" style="grid-column: 11; grid-row: 11;">Стоянка</div>
      <div class="cell" style="grid-column: 10; grid-row: 11;">21</div>
      <div class="cell special" style="grid-column: 9; grid-row: 11;">?</div>
      <div class="cell" style="grid-column: 8; grid-row: 11;">23</div>
      <div class="cell" style="grid-column: 7; grid-row: 11;">24</div>
      <div class="cell special" style="grid-column: 6; grid-row: 11;">?</div>
      <div class="cell" style="grid-column: 5; grid-row: 11;">26</div>
      <div class="cell" style="grid-column: 4; grid-row: 11;">27</div>
      <div class="cell special" style="grid-column: 3; grid-row: 11;">?</div>
      <div class="cell" style="grid-column: 2; grid-row: 11;">29</div>
      <div class="cell corner" style="grid-column: 1; grid-row: 11;">Арест</div>

      <!-- ================= ЛЕВАЯ СТОРОНА (Колонка 1, Строки 10..2) ================= -->
      <div class="cell" style="grid-column: 1; grid-row: 10;">31</div>
      <div class="cell special" style="grid-column: 1; grid-row: 9;">?</div>
      <div class="cell" style="grid-column: 1; grid-row: 8;">33</div>
      <div class="cell" style="grid-column: 1; grid-row: 7;">34</div>
      <div class="cell special" style="grid-column: 1; grid-row: 6;">?</div>
      <div class="cell" style="grid-column: 1; grid-row: 5;">36</div>
      <div class="cell" style="grid-column: 1; grid-row: 4;">37</div>
      <div class="cell special" style="grid-column: 1; grid-row: 3;">?</div>
      <div class="cell" style="grid-column: 1; grid-row: 2;">39</div>

      <!-- ================= ЦЕНТРАЛЬНАЯ ЧАСТЬ (Периметр 2..10) ================= -->
      <div class="center-zone">
        <span>МОНОПОЛИЯ</span>
      </div>

    </div>
  </div>

</body>
</html>
