<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Монополия 11x11</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #2c3e50, #0f172a);
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Трехмерная сцена */
    .scene {
      width: 100vw;
      height: 75vh;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    /* Игровое поле */
    .board {
      width: min(72vw, 72vh);
      height: min(72vw, 72vh);
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(11, 1fr);
      gap: 5px;
      background: #1e293b;
      padding: 12px;
      border-radius: 16px;
      transform: rotateX(52deg) rotateZ(-45deg);
      transform-style: preserve-3d;
      box-shadow: -20px 20px 40px rgba(0, 0, 0, 0.8),
                  inset 0 0 15px rgba(255, 255, 255, 0.1);
    }

    /* Объемная ячейка (3D кубик/плитка) */
    .cell {
      position: relative;
      background: linear-gradient(135deg, #ffffff, #e2e8f0);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(5px, 0.8vw, 9px);
      font-weight: 800;
      color: #0f172a;
      user-select: none;
      text-align: center;
      transform-style: preserve-3d;
      transform: translateZ(10px);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      /* Боковые 3D грани и тени */
      box-shadow: -2px 2px 0px #cbd5e1,
                  -4px 4px 0px #94a3b8,
                  -6px 6px 10px rgba(0, 0, 0, 0.5);
    }

    /* Цветные полосы улиц Монополии */
    .street-color {
      width: 100%;
      height: 28%;
      border-top-left-radius: 3px;
      border-top-right-radius: 3px;
      border-bottom: 1px solid rgba(0,0,0,0.15);
    }

    .color-brown  { background: #8B4513; }
    .color-cyan   { background: #87CEEB; }
    .color-pink   { background: #FF69B4; }
    .color-orange { background: #FFA500; }
    .color-red    { background: #FF0000; }
    .color-yellow { background: #FFD700; }
    .color-green  { background: #008000; }
    .color-blue   { background: #0000FF; }

    /* Особые типы ячеек */
    .corner {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff;
      justify-content: center;
    }

    .special {
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      color: #fff;
      justify-content: center;
    }

    /* Анимация прогибания и подсветки при наступании */
    .cell.step-active {
      transform: translateZ(1px) !important; /* Прогибается вниз */
      background: #fef08a !important; /* Яркий золотистый цвет */
      box-shadow: -1px 1px 0px #ca8a04,
                  0 0 25px #facc15, 
                  inset 0 0 10px #eab308 !important;
    }

    /* Фишка игрока */
    .player-token {
      width: 60%;
      height: 60%;
      background: radial-gradient(circle at 30% 30%, #ff4d4d, #990000);
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 20%;
      left: 20%;
      transform: translateZ(15px);
      box-shadow: 0 5px 10px rgba(0,0,0,0.6);
      transition: all 0.2s ease-in-out;
      pointer-events: none;
      z-index: 10;
    }

    /* Центральная часть карты */
    .center-zone {
      grid-column: 2 / 11;
      grid-row: 2 / 11;
      background: linear-gradient(135deg, #059669, #047857);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      transform: translateZ(2px);
      box-shadow: inset -4px 4px 15px rgba(0, 0, 0, 0.6),
                  -3px 3px 0px #065f46;
      border: 2px dashed rgba(255, 255, 255, 0.3);
    }

    .center-title {
      font-size: clamp(14px, 2.5vw, 32px);
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .dice-result {
      margin-top: 10px;
      font-size: clamp(12px, 1.5vw, 20px);
      background: rgba(0,0,0,0.3);
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* Панель управления с кнопкой */
    .controls {
      height: 20vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .roll-btn {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle at 30% 30%, #ef4444, #991b1b);
      color: white;
      border: 4px solid #fca5a5;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.5),
                  0 5px 0px #7f1d1d;
      transition: all 0.1s ease;
      outline: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
    }

    .roll-btn:active {
      transform: translateY(4px);
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.5),
                  0 1px 0px #7f1d1d;
    }

    .roll-btn:disabled {
      background: #64748b;
      border-color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="board" id="board">
      
      <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ -->
      <div class="center-zone">
        <div class="center-title">МОНОПОЛИЯ</div>
        <div class="dice-result" id="diceStatus">Выпало: -</div>
      </div>

      <!-- Фишка игрока -->
      <div class="player-token" id="token"></div>

    </div>
  </div>

  <div class="controls">
    <button class="roll-btn" id="rollBtn" onclick="makeMove()">
      <span>ХОД</span>
    </button>
  </div>

  <script>
    // Порядок ячеек по периметру 11x11 (всего 40 ячеек)
    const trackSequence = [];

    // Верхний ряд (1..11)
    for (let c = 1; c <= 11; c++) trackSequence.push({ col: c, row: 1 });
    // Правая сторона (2..10)
    for (let r = 2; r <= 10; r++) trackSequence.push({ col: 11, row: r });
    // Нижний ряд (11..1)
    for (let c = 11; c >= 1; c--) trackSequence.push({ col: c, row: 11 });
    // Левая сторона (10..2)
    for (let r = 10; r >= 2; r--) trackSequence.push({ col: 1, row: r });

    // Классические цветовые группы улиц Монополии
    const streetColors = {
      1: 'color-brown', 3: 'color-brown',
      6: 'color-cyan', 8: 'color-cyan', 9: 'color-cyan',
      11: 'color-pink', 13: 'color-pink', 14: 'color-pink',
      16: 'color-orange', 18: 'color-orange', 19: 'color-orange',
      21: 'color-red', 23: 'color-red', 24: 'color-red',
      26: 'color-yellow', 27: 'color-yellow', 29: 'color-yellow',
      31: 'color-green', 32: 'color-green', 34: 'color-green',
      37: 'color-blue', 39: 'color-blue'
    };

    const boardEl = document.getElementById('board');
    const tokenEl = document.getElementById('token');
    const rollBtn = document.getElementById('rollBtn');
    const diceStatus = document.getElementById('diceStatus');

    const cellElements = [];
    let currentPosition = 0; // Начинаем со Старта

    // Генерация 40 клеток периметра
    trackSequence.forEach((pos, idx) => {
      const cell = document.createElement('div');
      cell.style.gridColumn = pos.col;
      cell.style.gridRow = pos.row;

      // Угловые и специальные клетки
      if (idx === 0) {
        cell.className = 'cell corner';
        cell.innerText = 'СТАРТ';
      } else if (idx === 10) {
        cell.className = 'cell corner';
        cell.innerText = 'ТЮРЬМА';
      } else if (idx === 20) {
        cell.className = 'cell corner';
        cell.innerText = 'СТОЯНКА';
      } else if (idx === 30) {
        cell.className = 'cell corner';
        cell.innerText = 'АРЕСТ';
      } else if (idx % 5 === 2) {
        cell.className = 'cell special';
        cell.innerText = '?';
      } else {
        cell.className = 'cell';
        if (streetColors[idx]) {
          const colorBar = document.createElement('div');
          colorBar.className = `street-color ${streetColors[idx]}`;
          cell.appendChild(colorBar);
        }
        const label = document.createElement('span');
        label.innerText = `$${(idx + 1) * 10}`;
        label.style.marginBottom = '2px';
        cell.appendChild(label);
      }

      boardEl.appendChild(cell);
      cellElements.push(cell);
    });

    // Функция обновления положения фишки
    function updateTokenPosition(index) {
      const targetCell = cellElements[index];
      targetCell.appendChild(tokenEl);
    }

    // Инициализация фишки на старте
    updateTokenPosition(0);

    // Функция пошагового хода
    async function makeMove() {
      rollBtn.disabled = true;
      const dice = Math.floor(Math.random() * 6) + 1;
      diceStatus.innerText = `Выпало: ${dice}`;

      for (let i = 0; i < dice; i++) {
        currentPosition = (currentPosition + 1) % 40;
        const currentCell = cellElements[currentPosition];

        // Эффект прогибания и подсветки ячейки
        currentCell.classList.add('step-active');
        updateTokenPosition(currentPosition);

        await new Promise(resolve => setTimeout(resolve, 220));

        // Возвращение ячейки в исходное состояние
        currentCell.classList.remove('step-active');
      }

      rollBtn.disabled = false;
    }
  </script>
</body>
</html>
