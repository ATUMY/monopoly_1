<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balance Preview</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Увеличенный контейнер бара */
    .balance-bar {
      display: flex;
      align-items: center;
      gap: 20px; /* Увеличенный отступ */
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      padding: 15px 30px; /* Увеличенные отступы внутри */
      border-radius: 35px; /* Увеличенный радиус */
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    /* ЗНАЧИТЕЛЬНО увеличенная иконка монетки (64px) */
    .coin-icon {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    /* Увеличенный баланс */
    .balance-amount {
      color: #2ecc71;
      font-size: 32px; /* Увеличенный шрифт */
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    /* Увеличенная кнопка пополнения */
    .add-btn {
      background: #2ecc71;
      color: #000;
      border: none;
      width: 50px; /* Увеличенный размер кнопки */
      height: 50px;
      border-radius: 50%;
      font-size: 32px; /* Увеличенный шрифт плюса */
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, background-color 0.2s ease;
      user-select: none;
    }

    .add-btn:hover {
      background: #27ae60;
      transform: scale(1.08);
    }

    .add-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="balance-bar">
    <img src="https://raw.githubusercontent.com/ATUMY/monopoly_1/main/assets/icon_money.png" alt="Coin" class="coin-icon">
    <span class="balance-amount" id="balance">1500 €</span>
    <button class="add-btn" id="addBtn" aria-label="Пополнить баланс">+</button>
  </div>

  <script>
    let currentBalance = 1500;
    const balanceElement = document.getElementById('balance');
    const addBtn = document.getElementById('addBtn');

    addBtn.addEventListener('click', () => {
      currentBalance += 100;
      balanceElement.textContent = `${currentBalance} €`;
    });
  </script>

</body>
</html>
