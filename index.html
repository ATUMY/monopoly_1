<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monopoly Game</title>
  <link rel="icon" href="data:,">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Экран входа (по умолчанию виден) */
    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://raw.githubusercontent.com/ATUMY/monopoly_1/main/assets/icon_start.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 10;
      padding: 20px;
    }

    /* Затемнение для читаемости элементов на фоне */
    #login-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    /* Поле ввода имени */
    .login-input {
      width: 260px;
      max-width: 80%;
      padding: 14px 20px;
      font-size: 16px;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 25px;
      outline: none;
      text-align: center;
    }

    .login-input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    /* Кнопка подключиться */
    .login-btn {
      width: 260px;
      max-width: 80%;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      color: #000;
      background: #2ecc71;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
    }

    .login-btn:hover {
      background: #27ae60;
      transform: scale(1.03);
    }

    .login-btn:active {
      transform: scale(0.97);
    }

    /* Игровой интерфейс (скрыт до входа) */
    #game-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    /* Контейнер бара */
    .balance-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    /* Иконка монетки */
    .coin-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    /* Баланс */
    .balance-amount {
      color: #2ecc71;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Кнопка пополнения */
    .add-btn {
      background: #2ecc71;
      color: #000;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, background-color 0.2s ease;
      user-select: none;
    }

    .add-btn:hover {
      background: #27ae60;
      transform: scale(1.08);
    }

    .add-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Экран входа -->
  <div id="login-screen">
    <input type="text" id="usernameInput" class="login-input" placeholder="Введите ваше имя" autocomplete="off">
    <button id="loginBtn" class="login-btn">Подключиться</button>
  </div>

  <!-- Игровой экран (с баром баланса) -->
  <div id="game-screen">
    <div class="balance-bar">
      <img src="https://raw.githubusercontent.com/ATUMY/monopoly_1/main/assets/icon_money.png" alt="Coin" class="coin-icon">
      <span class="balance-amount" id="balance">1500 €</span>
      <button class="add-btn" id="addBtn" aria-label="Пополнить баланс">+</button>
    </div>
  </div>

  <script>
    const loginScreen = document.getElementById('login-screen');
    const gameScreen = document.getElementById('game-screen');
    const usernameInput = document.getElementById('usernameInput');
    const loginBtn = document.getElementById('loginBtn');

    let currentBalance = 1500;
    const balanceElement = document.getElementById('balance');
    const addBtn = document.getElementById('addBtn');

    // Обработка клика по кнопке входа
    loginBtn.addEventListener('click', () => {
      const name = usernameInput.value.trim();
      if (name === '') {
        alert('Пожалуйста, введите имя!');
        return;
      }
      
      // Скрываем экран входа, показываем игровой
      loginScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
    });

    // Обработка пополнения баланса
    addBtn.addEventListener('click', () => {
      currentBalance += 100;
      balanceElement.textContent = `${currentBalance} €`;
    });
  </script>

</body>
</html>
