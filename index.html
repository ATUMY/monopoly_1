<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Monopoly Board</title>
  <style>
    :root {
      /* Использование vmin делает поле адаптивным: оно всегда вписывается в экран */
      --board-size: min(85vw, 85vh); 
      --cell-size: calc(var(--board-size) / 11);
      --bg-color: #12131C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1e2235 0%, var(--bg-color) 100%);
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden; /* Чтобы не было скролла */
      color: #fff;
    }

    /* Контейнер для центрирования */
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 20px;
    }

    .scene {
      width: var(--board-size);
      height: var(--board-size);
      perspective: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .board-3d {
      width: var(--board-size);
      height: var(--board-size);
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(55deg) rotateZ(-40deg);
      box-shadow: -20px 20px 50px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
    }

    .board-surface {
      width: 100%;
      height: 100%;
      background-color: #cbe6d4;
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(11, 1fr);
      border: 4px solid #2e4033;
      border-radius: 6px;
    }

    .center-space {
      grid-column: 2 / 11;
      grid-row: 2 / 11;
      background: #a2d2a9;
    }

    .cell {
      border: 1px solid #2e4033;
      position: relative;
      background-color: #e8f5e9;
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    .color-bar {
      position: absolute;
      background-color: var(--bar-color, transparent);
    }

    .side-bottom .color-bar { top: 0; left: 0; right: 0; height: 25%; }
    .side-left .color-bar   { top: 0; bottom: 0; right: 0; width: 25%; }
    .side-top .color-bar    { bottom: 0; left: 0; right: 0; height: 25%; }
    .side-right .color-bar  { top: 0; bottom: 0; left: 0; width: 25%; }

    .cell.active {
      background-color: #fff !important;
      box-shadow: inset 0 0 10px var(--bar-color, #ffeb3b), 0 0 15px var(--bar-color, #ffeb3b);
      z-index: 5;
    }

    .dice-token {
      width: calc(var(--cell-size) * 0.6);
      height: calc(var(--cell-size) * 0.6);
      position: absolute;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      pointer-events: none;
    }

    .cube {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform: rotateX(-20deg) rotateY(25deg);
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #fff;
      border: 1px solid #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--cell-size) * 0.2);
    }

    .face.front { transform: translateZ(calc(var(--cell-size) * 0.3)); }
    /* ... остальные грани ... */
    .face.back { transform: rotateY(180deg) translateZ(calc(var(--cell-size) * 0.3)); }
    .face.right { transform: rotateY(90deg) translateZ(calc(var(--cell-size) * 0.3)); }
    .face.left { transform: rotateY(-90deg) translateZ(calc(var(--cell-size) * 0.3)); }
    .face.top { transform: rotateX(90deg) translateZ(calc(var(--cell-size) * 0.3)); }
    .face.bottom { transform: rotateX(-90deg) translateZ(calc(var(--cell-size) * 0.3)); }

    .controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .roll-btn {
      padding: 15px 40px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(to bottom, #ff416c, #ff4b2b);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="scene">
      <div class="board-3d">
        <div class="board-surface" id="board">
          <div class="center-space"></div>
        </div>
        <div class="dice-token" id="token">
          <div class="cube">
            <div class="face front">🎲</div><div class="face back">🎲</div>
            <div class="face right">🎲</div><div class="face left">🎲</div>
            <div class="face top">🎲</div><div class="face bottom">🎲</div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="roll-btn" id="rollBtn">ХОД</button>
    </div>
  </div>

  <script>
    const boardColors = [
      null, '#8B4513', null, '#8B4513', null, '#a0a0a0', '#87CEEB', null, '#87CEEB', '#87CEEB',
      null, '#FF007F', null, '#FF007F', '#FF007F', '#a0a0a0', '#FF8C00', null, '#FF8C00', '#FF8C00',
      null, '#FF0000', null, '#FF0000', '#FF0000', '#a0a0a0', '#FFD700', '#FFD700', null, '#FFD700',
      null, '#008000', '#008000', null, '#008000', '#a0a0a0', null, '#00008B', null, '#00008B'
    ];

    function generatePathCoords() {
      const coords = [];
      for (let x = 10; x >= 0; x--) coords.push({ col: x, row: 10, side: 'side-bottom' });
      for (let y = 9; y >= 0; y--) coords.push({ col: 0, row: y, side: 'side-left' });
      for (let x = 1; x <= 10; x++) coords.push({ col: x, row: 0, side: 'side-top' });
      for (let y = 1; y <= 9; y++) coords.push({ col: 10, row: y, side: 'side-right' });
      return coords;
    }

    const pathCoords = generatePathCoords();
    const cellsMap = [];
    let currentPosition = 0;

    function initBoard() {
      const board = document.getElementById('board');
      pathCoords.forEach((pos, index) => {
        const cell = document.createElement('div');
        cell.className = `cell ${pos.side}`;
        cell.style.gridColumn = pos.col + 1;
        cell.style.gridRow = pos.row + 1;
        if (boardColors[index]) {
          cell.style.setProperty('--bar-color', boardColors[index]);
          const bar = document.createElement('div');
          bar.className = 'color-bar';
          cell.appendChild(bar);
        }
        board.appendChild(cell);
        cellsMap[index] = cell;
      });
      updateTokenPosition(0);
    }

    function updateTokenPosition(index) {
      const token = document.getElementById('token');
      const cell = cellsMap[index];
      // Используем offsetLeft/Top относительно родителя для адаптивности
      const left = cell.offsetLeft + (cell.offsetWidth - token.offsetWidth) / 2;
      const top = cell.offsetTop + (cell.offsetHeight - token.offsetHeight) / 2;
      token.style.left = `${left}px`;
      token.style.top = `${top}px`;
      cell.classList.add('active');
      setTimeout(() => cell.classList.remove('active'), 400);
    }

    document.getElementById('rollBtn').addEventListener('click', async () => {
      const steps = Math.floor(Math.random() * 6) + 1;
      for (let i = 0; i < steps; i++) {
        currentPosition = (currentPosition + 1) % 40;
        updateTokenPosition(currentPosition);
        await new Promise(r => setTimeout(r, 300));
      }
    });

    window.addEventListener('load', initBoard);
    // Добавляем слушатель ресайза, чтобы фишка не улетала при изменении размера окна
    window.addEventListener('resize', () => updateTokenPosition(currentPosition));
  </script>
</body>
</html>
